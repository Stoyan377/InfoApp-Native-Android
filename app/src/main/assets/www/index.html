<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="viewport-fit=cover, user-scalable=no, initial-scale=1, width=device-width">
    <meta name="theme-color" content="#1a73e8">
    <meta name="description" content="InfoApp - Display device information and status">
    <link rel="stylesheet" type="text/css" href="css/index.css">
    <title>InfoApp</title>
</head>
<body>
    <main class="app" role="main">
        <header class="header">
            <h1>InfoApp</h1>
            <p class="subtitle">Информация за вашето устройство</p>
        </header>

        <section class="status-section" aria-label="System Information">
            <div class="status-display">
                <div class="status-item">
                    <span class="label">Време:</span>
                    <span class="value" id="timeDisplay">--:--:--</span>
                </div>
                <div class="status-item">
                    <span class="label">Дата:</span>
                    <span class="value" id="dateDisplay">--/--/----</span>
                </div>
            </div>
        </section>

        <section class="actions-section" aria-label="Device Information Options">
            <button class="btn" id="batteryBtn" aria-label="Show battery status">
                <span class="btn-icon">🔋</span>
                <span class="btn-text">Батерия</span>
            </button>
            <button class="btn" id="deviceBtn" aria-label="Show device details">
                <span class="btn-icon">📱</span>
                <span class="btn-text">Устройство</span>
            </button>
            <button class="btn" id="networkBtn" aria-label="Show network information">
                <span class="btn-icon">📡</span>
                <span class="btn-text">Мрежа</span>
            </button>
            <button class="btn" id="orientationBtn" aria-label="Show device orientation">
                <span class="btn-icon">🔄</span>
                <span class="btn-text">Ориентация</span>
            </button>
            <button class="btn" id="locationBtn" aria-label="Show geolocation">
                <span class="btn-icon">📍</span>
                <span class="btn-text">Местоположение</span>
            </button>
        </section>

        <dialog id="infoModal" class="modal">
            <div class="modal-content">
                <button class="modal-close" aria-label="Close dialog">&times;</button>
                <h2 id="modalTitle"></h2>
                <div id="modalBody"></div>
            </div>
        </dialog>
    </main>

    <script type="text/javascript" src="scripts/index.js"></script>
</body>
</html>
